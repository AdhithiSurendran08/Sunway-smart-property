{% extends "base.html" %}
{% block title %}Find My Property — Sunway Smart Property{% endblock %}

{% block content %}
<div class="finder-container">
  <span class="eyebrow">Step 1 of 2</span>
  <h1 class="page-title">Find your property</h1>
  <p class="page-sub">Tell us what matters to you — we'll score every available listing against it.</p>

  <form method="POST" class="card">
    {% csrf_token %}

    <label for="budget">Maximum budget (RM)</label>
    <input type="number" id="budget" name="budget" placeholder="e.g. 600000" required>

    <label for="property_type">Property type</label>
    <select id="property_type" name="property_type">
      <option value="">Any type</option>
      <option>Condominium</option>
      <option>Serviced Apartment</option>
      <option>Apartment</option>
      <option>Terrace House</option>
      <option>Townhouse</option>
      <option>SOHO</option>
    </select>

    <label for="transport">Near public transport?</label>
    <select id="transport" name="transport">
      <option value="no">No preference</option>
      <option value="yes">Yes, important</option>
    </select>

    <label for="green">Sustainability features?</label>
    <select id="green" name="green">
      <option value="no">No preference</option>
      <option value="yes">Important to me</option>
    </select>

    <button type="submit" class="button">Show my matches →</button>
  </form>
</div>
{% endblock %}
